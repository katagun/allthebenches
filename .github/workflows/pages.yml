name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run benches validate
      - run: uv run python -m scripts.check-generated
      - run: uv run ruff check pipeline tests scripts
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm audit --audit-level low
        working-directory: web
      - run: uv run python scripts/audit-python-dependencies.py
      - run: pnpm run lint
        working-directory: web
      - run: pnpm run typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - name: Build static application
        run: pnpm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /
      - run: uv run python scripts/check-bundle.py
      - name: Install layout test browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: web
      - name: Mobile and desktop layout regression checks
        run: pnpm test:layout
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-failure-artifacts
          path: web/test-results/
          retention-days: 7
      - name: Verify custom domain artifact
        run: test "$(cat web/dist/CNAME)" = "allthebenches.com"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
