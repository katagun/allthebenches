[project]
name = "allthebenches-pipeline"
version = "0.1.0"
description = "Validated offline data pipeline for All the Benches"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "pytest>=9,<10"]

[project.scripts]
benches = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.17.1,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F", "B", "S102", "S307", "S602", "S608"]
