name: Curated data freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * *'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Check curated data freshness
        run: uv run python -m pipeline.freshness --report freshness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-data-freshness
          path: freshness-report.json
          retention-days: 14
