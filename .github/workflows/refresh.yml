name: Stage upstream metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Collect discovery feeds for review
        id: collect
        continue-on-error: true
        run: uv run benches collect --source all
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Collect details for matched routes
        id: endpoints
        if: always()
        continue-on-error: true
        run: uv run benches collect-endpoints
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Write review-only reconciliation proposal
        id: reconcile
        if: always()
        continue-on-error: true
        run: uv run benches reconcile
      - name: Fail if a review collection step failed
        if: always()
        run: |
          test "${{ steps.collect.outcome }}" = success
          test "${{ steps.endpoints.outcome }}" = success
          test "${{ steps.reconcile.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-metadata-review
          path: data/staging/
          retention-days: 14
